<section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  {% if eyebrow %}<p class="text-xs font-semibold uppercase tracking-wide text-slate-400">{{ eyebrow }}</p>{% endif %}
  {% if title %}<h3 class="{% if eyebrow %}mt-1{% endif %} text-base font-semibold text-slate-900">{{ title }}</h3>{% endif %}
  {% if metric %}<p class="mt-3 text-3xl font-bold tracking-tight text-slate-900">{{ metric }}</p>{% endif %}
  {% if text %}<p class="mt-2 text-sm leading-6 text-slate-500">{{ text }}</p>{% endif %}
  {% if footer %}<div class="mt-4 border-t border-slate-100 pt-4 text-sm text-slate-600">{{ footer }}</div>{% endif %}
</section>
