{% firstof id name as field_id %}
<div>
  {% if label %}<label for="{{ field_id }}" class="mb-1.5 block text-sm font-medium text-slate-700">{{ label }}{% if required %}<span class="ml-0.5 text-danger" aria-hidden="true">*</span>{% endif %}</label>{% endif %}
  <select id="{{ field_id }}" name="{{ name }}" {% if required %}required{% endif %} {% if disabled %}disabled{% endif %} {% if error %}aria-invalid="true" aria-describedby="{{ field_id }}-error"{% endif %} class="block h-10 w-full rounded-lg border bg-white px-3 text-sm text-slate-900 shadow-sm outline-none transition disabled:cursor-not-allowed disabled:bg-slate-100 {% if error %}border-red-400 focus:border-danger focus:ring-2 focus:ring-red-100{% else %}border-slate-300 focus:border-primary-600 focus:ring-2 focus:ring-primary-100{% endif %}">
    {% if placeholder %}<option value="">{{ placeholder }}</option>{% endif %}
    {% for option in options %}<option value="{{ option.value }}" {% if option.value == value %}selected{% endif %} {% if option.disabled %}disabled{% endif %}>{{ option.label }}</option>{% endfor %}
  </select>
  {% if error %}<p id="{{ field_id }}-error" class="mt-1.5 text-sm text-danger" role="alert">{{ error|striptags }}</p>{% endif %}
</div>
