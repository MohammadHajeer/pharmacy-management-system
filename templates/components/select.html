{% firstof id name as field_id %}
<div>
  {% if label %}
    <label for="{{ field_id }}" class="mb-1.5 block text-sm font-medium leading-none text-slate-700">
      {{ label }}{% if required %}<span class="ml-0.5 text-red-600" aria-hidden="true">*</span><span class="sr-only"> (required)</span>{% endif %}
    </label>
  {% endif %}
  <div class="relative">
    <select id="{{ field_id }}" name="{{ name }}" {% if required %}required{% endif %} {% if disabled %}disabled{% endif %} {% if error %}aria-invalid="true"{% endif %} {% if error or help_text %}aria-describedby="{% if help_text %}{{ field_id }}-help{% endif %}{% if error %}{% if help_text %} {% endif %}{{ field_id }}-error{% endif %}"{% endif %} class="block h-10 w-full appearance-none rounded-lg border bg-white py-0 pl-3 pr-10 text-sm text-slate-900 shadow-xs outline-none transition-colors focus:ring-2 focus:ring-offset-0 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500 {% if error %}border-red-500 focus:border-red-600 focus:ring-red-100{% else %}border-slate-200 hover:border-slate-300 focus:border-primary-600 focus:ring-primary-100{% endif %}">
      {% if placeholder %}<option value="">{{ placeholder }}</option>{% endif %}
      {% for option in options %}<option value="{{ option.value }}" {% if option.value == value %}selected{% endif %} {% if option.disabled %}disabled{% endif %}>{{ option.label }}</option>{% endfor %}
    </select>
    <svg class="pointer-events-none absolute right-3 top-1/2 size-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="m8 10 4 4 4-4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  {% if help_text %}<p id="{{ field_id }}-help" class="mt-1.5 text-sm leading-5 text-slate-500">{{ help_text }}</p>{% endif %}
  {% if error %}<p id="{{ field_id }}-error" class="mt-1.5 text-sm leading-5 text-red-600" role="alert">{{ error|striptags }}</p>{% endif %}
</div>
