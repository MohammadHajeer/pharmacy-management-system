{% firstof id name as field_id %}
<div>
  {% if label %}
    <label for="{{ field_id }}" class="mb-2 block text-sm font-semibold leading-none text-slate-800">
      {{ label }}{% if required %}<span class="ml-0.5 text-red-600" aria-hidden="true">*</span><span class="sr-only"> (required)</span>{% endif %}
    </label>
  {% endif %}
  <input id="{{ field_id }}" name="{{ name }}" type="{{ type|default:'text' }}" value="{{ value|default_if_none:'' }}" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %} {% if maxlength %}maxlength="{{ maxlength }}"{% endif %} {% if autofocus %}autofocus{% endif %} {% if required %}required{% endif %} {% if disabled %}disabled{% endif %} {% if readonly %}readonly{% endif %} {% if error %}aria-invalid="true"{% endif %} {% if error or help_text %}aria-describedby="{% if help_text %}{{ field_id }}-help{% endif %}{% if error %}{% if help_text %} {% endif %}{{ field_id }}-error{% endif %}"{% endif %} class="block h-11 w-full rounded-xl border bg-white px-3.5 text-sm text-slate-900 outline-none transition-colors placeholder:text-slate-400 focus:ring-2 focus:ring-offset-0 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500 read-only:bg-slate-50 read-only:text-slate-600 {% if error %}border-red-500 focus:border-red-600 focus:ring-red-100{% else %}border-slate-200 hover:border-slate-300 focus:border-primary-600 focus:ring-primary-100{% endif %}">
  {% if help_text %}<p id="{{ field_id }}-help" class="mt-1.5 text-xs leading-5 text-slate-500">{{ help_text }}</p>{% endif %}
  {% if error %}<p id="{{ field_id }}-error" class="mt-1.5 text-sm leading-5 text-red-600" role="alert">{{ error|striptags }}</p>{% endif %}
</div>
