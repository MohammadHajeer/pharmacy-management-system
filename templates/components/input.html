{% firstof id name as field_id %}
<div>
  {% if label %}<label for="{{ field_id }}" class="mb-1.5 block text-sm font-medium text-slate-700">{{ label }}{% if required %}<span class="ml-0.5 text-danger" aria-hidden="true">*</span>{% endif %}</label>{% endif %}
  <input id="{{ field_id }}" name="{{ name }}" type="{{ type|default:'text' }}" value="{{ value|default_if_none:'' }}" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %} {% if maxlength %}maxlength="{{ maxlength }}"{% endif %} {% if autofocus %}autofocus{% endif %} {% if required %}required{% endif %} {% if disabled %}disabled{% endif %} {% if error %}aria-invalid="true" aria-describedby="{{ field_id }}-error"{% elif help_text %}aria-describedby="{{ field_id }}-help"{% endif %} class="block h-10 w-full rounded-lg border bg-white px-3 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500 {% if error %}border-red-400 focus:border-danger focus:ring-2 focus:ring-red-100{% else %}border-slate-300 focus:border-primary-600 focus:ring-2 focus:ring-primary-100{% endif %}">
  {% if error %}<p id="{{ field_id }}-error" class="mt-1.5 text-sm text-danger" role="alert">{{ error|striptags }}</p>{% elif help_text %}<p id="{{ field_id }}-help" class="mt-1.5 text-sm text-slate-500">{{ help_text }}</p>{% endif %}
</div>
