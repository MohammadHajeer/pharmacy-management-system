{% firstof id name as field_id %}
<div>
  {% if label %}
    <label for="{{ field_id }}" class="mb-2 block text-sm font-semibold leading-none text-ink-soft">
      {{ label }}{% if required %}<span class="ml-0.5 text-negative" aria-hidden="true">*</span><span class="sr-only"> (required)</span>{% endif %}
    </label>
  {% endif %}
  <input id="{{ field_id }}" name="{{ name }}" type="{{ type|default:'text' }}" value="{{ value|default_if_none:'' }}" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %} {% if maxlength %}maxlength="{{ maxlength }}"{% endif %} {% if autofocus %}autofocus{% endif %} {% if step %}step="{{ step }}"{% endif %} {% if min != None %}min="{{ min }}"{% endif %} {% if max != None %}max="{{ max }}"{% endif %} {% if required %}required{% endif %} {% if disabled %}disabled{% endif %} {% if readonly %}readonly{% endif %} {% if error %}aria-invalid="true"{% endif %} {% if error or help_text %}aria-describedby="{% if help_text %}{{ field_id }}-help{% endif %}{% if error %}{% if help_text %} {% endif %}{{ field_id }}-error{% endif %}"{% endif %} class="block h-11 w-full rounded-xl border bg-surface px-3.5 text-sm text-ink outline-none placeholder:text-faint focus:ring-2 focus:ring-offset-0 disabled:cursor-not-allowed disabled:bg-surface-hover disabled:text-muted read-only:bg-surface-muted read-only:text-copy {% if error %}border-red-500 focus:border-red-600 focus:ring-negative-ring{% else %}border-line hover:border-line-strong focus:border-primary-600 focus:ring-accent-tint{% endif %}">
  {% if help_text %}<p id="{{ field_id }}-help" class="mt-1.5 text-xs leading-5 text-muted">{{ help_text }}</p>{% endif %}
  {% if error %}<p id="{{ field_id }}-error" class="mt-1.5 text-sm leading-5 text-negative" role="alert">{{ error|striptags }}</p>{% endif %}
</div>
