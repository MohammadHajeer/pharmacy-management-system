{% if href %}
  {% if disabled %}
    <span aria-disabled="true" class="inline-flex cursor-not-allowed items-center justify-center gap-2 whitespace-nowrap {% if pill %}rounded-full{% else %}rounded-lg{% endif %} text-sm font-medium opacity-50 {% if full_width %}w-full{% endif %} {% if size == 'sm' %}h-8 px-3 text-xs{% elif size == 'lg' %}h-11 px-6{% elif size == 'icon' %}size-10 p-0{% else %}h-10 px-4{% endif %} {% if variant == 'danger' or variant == 'destructive' %}bg-red-600 text-white{% elif variant == 'ghost' %}bg-transparent text-copy{% elif variant == 'outline' %}border border-line bg-surface text-body{% elif variant == 'secondary' %}bg-surface-hover text-ink{% else %}bg-primary-600 text-white{% endif %}">{{ text }}</span>
  {% else %}
    <a href="{{ href }}" class="inline-flex items-center justify-center gap-2 whitespace-nowrap {% if pill %}rounded-full{% else %}rounded-lg{% endif %} text-sm font-medium duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 focus-visible:ring-offset-2 {% if full_width %}w-full{% endif %} {% if size == 'sm' %}h-8 px-3 text-xs{% elif size == 'lg' %}h-11 px-6{% elif size == 'icon' %}size-10 p-0{% else %}h-10 px-4{% endif %} {% if variant == 'danger' or variant == 'destructive' %}bg-red-600 text-white {% if not flat %}shadow-sm {% endif %}hover:bg-red-700{% elif variant == 'ghost' %}bg-transparent text-copy hover:bg-surface-hover hover:text-ink{% elif variant == 'outline' %}border border-line bg-surface text-body {% if not flat %}shadow-xs {% endif %}hover:bg-surface-muted hover:text-ink{% elif variant == 'secondary' %}bg-surface-hover text-ink hover:bg-surface-pressed{% else %}bg-primary-600 text-white {% if not flat %}shadow-sm {% endif %}hover:bg-primary-700{% endif %}">{{ text }}</a>
  {% endif %}
{% else %}
  <button type="{{ type|default:'button' }}" {% if disabled %}disabled{% endif %} {% if loading_text %}data-submit-button aria-busy="false"{% endif %} {% if dirty_submit %}data-dirty-submit{% endif %} {% if modal_target %}data-modal-open="{{ modal_target }}" aria-haspopup="dialog" aria-controls="{{ modal_target }}"{% endif %} {% if modal_close %}data-modal-close{% endif %} {% if toast_message %}data-toast-trigger data-toast-level="{{ toast_level|default:'info' }}" data-toast-message="{{ toast_message }}"{% if toast_title %} data-toast-title="{{ toast_title }}"{% endif %}{% if toast_duration %} data-toast-duration="{{ toast_duration }}"{% endif %}{% endif %} class="inline-flex items-center justify-center gap-2 whitespace-nowrap {% if pill %}rounded-full{% else %}rounded-lg{% endif %} text-sm font-medium duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 {% if full_width %}w-full{% endif %} {% if size == 'sm' %}h-8 px-3 text-xs{% elif size == 'lg' %}h-11 px-6{% elif size == 'icon' %}size-10 p-0{% else %}h-10 px-4{% endif %} {% if variant == 'danger' or variant == 'destructive' %}bg-red-600 text-white {% if not flat %}shadow-sm {% endif %}hover:bg-red-700 disabled:hover:bg-red-600{% elif variant == 'ghost' %}bg-transparent text-copy hover:bg-surface-hover hover:text-ink disabled:hover:bg-transparent disabled:hover:text-copy{% elif variant == 'outline' %}border border-line bg-surface text-body {% if not flat %}shadow-xs {% endif %}hover:bg-surface-muted hover:text-ink disabled:hover:bg-surface disabled:hover:text-body{% elif variant == 'secondary' %}bg-surface-hover text-ink hover:bg-surface-pressed disabled:hover:bg-surface-hover{% else %}bg-primary-600 text-white {% if not flat %}shadow-sm {% endif %}hover:bg-primary-700 disabled:hover:bg-primary-600{% endif %}">
    {% if loading_text %}
      <span data-submit-label>{{ text }}</span>
      <span data-submit-loading class="hidden items-center gap-2" role="status">
        <svg class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" />
          <path class="opacity-90" fill="currentColor" d="M21 12a9 9 0 0 0-9-9v3a6 6 0 0 1 6 6h3Z" />
        </svg>
        <span>{{ loading_text }}</span>
      </span>
    {% else %}
      {{ text }}
    {% endif %}
  </button>
{% endif %}
