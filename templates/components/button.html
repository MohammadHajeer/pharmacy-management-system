{% if href %}
  {% if disabled %}
    <span aria-disabled="true" class="inline-flex min-h-10 cursor-not-allowed items-center justify-center whitespace-nowrap rounded-lg px-4 py-2 text-sm font-semibold opacity-50 {% if full_width %}w-full{% endif %} {% if variant == 'danger' %}bg-danger text-white{% elif variant == 'ghost' %}bg-transparent text-slate-600{% elif variant == 'secondary' %}border border-slate-300 bg-white text-slate-700 shadow-sm{% else %}bg-primary-600 text-white shadow-sm{% endif %}">{{ text }}</span>
  {% else %}
    <a href="{{ href }}" class="inline-flex min-h-10 items-center justify-center whitespace-nowrap rounded-lg px-4 py-2 text-sm font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 focus-visible:ring-offset-2 {% if full_width %}w-full{% endif %} {% if variant == 'danger' %}bg-danger text-white shadow-sm hover:bg-red-700{% elif variant == 'ghost' %}bg-transparent text-slate-600 hover:bg-slate-100 hover:text-slate-900{% elif variant == 'secondary' %}border border-slate-300 bg-white text-slate-700 shadow-sm hover:bg-slate-50{% else %}bg-primary-600 text-white shadow-sm hover:bg-primary-700{% endif %}">{{ text }}</a>
  {% endif %}
{% else %}
  <button type="{{ type|default:'button' }}" {% if disabled %}disabled{% endif %} {% if loading_text %}data-submit-button aria-busy="false"{% endif %} {% if modal_target %}data-modal-open="{{ modal_target }}" aria-haspopup="dialog" aria-controls="{{ modal_target }}"{% endif %} {% if modal_close %}data-modal-close{% endif %} {% if toast_message %}data-toast-trigger data-toast-level="{{ toast_level|default:'info' }}" data-toast-message="{{ toast_message }}"{% endif %} class="inline-flex min-h-10 items-center justify-center whitespace-nowrap rounded-lg px-4 py-2 text-sm font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 {% if full_width %}w-full{% endif %} {% if variant == 'danger' %}bg-danger text-white shadow-sm hover:bg-red-700 disabled:hover:bg-danger{% elif variant == 'ghost' %}bg-transparent text-slate-600 hover:bg-slate-100 hover:text-slate-900 disabled:hover:bg-transparent disabled:hover:text-slate-600{% elif variant == 'secondary' %}border border-slate-300 bg-white text-slate-700 shadow-sm hover:bg-slate-50 disabled:hover:bg-white{% else %}bg-primary-600 text-white shadow-sm hover:bg-primary-700 disabled:hover:bg-primary-600{% endif %}">
    {% if loading_text %}
      <span data-submit-label>{{ text }}</span>
      <span data-submit-loading class="hidden items-center gap-2" role="status">
        <svg class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" />
          <path class="opacity-90" fill="currentColor" d="M21 12a9 9 0 0 0-9-9v3a6 6 0 0 1 6 6h3Z" />
        </svg>
        <span>{{ loading_text }}</span>
      </span>
    {% else %}
      {{ text }}
    {% endif %}
  </button>
{% endif %}
