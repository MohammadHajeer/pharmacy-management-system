{% if href %}
  {% if disabled %}
    <span aria-disabled="true" class="inline-flex min-h-10 cursor-not-allowed items-center justify-center whitespace-nowrap rounded-lg px-4 py-2 text-sm font-semibold opacity-50 {% if variant == 'danger' %}bg-danger text-white{% elif variant == 'ghost' %}bg-transparent text-slate-600{% elif variant == 'secondary' %}border border-slate-300 bg-white text-slate-700 shadow-sm{% else %}bg-primary-600 text-white shadow-sm{% endif %}">{{ text }}</span>
  {% else %}
    <a href="{{ href }}" class="inline-flex min-h-10 items-center justify-center whitespace-nowrap rounded-lg px-4 py-2 text-sm font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 focus-visible:ring-offset-2 {% if variant == 'danger' %}bg-danger text-white shadow-sm hover:bg-red-700{% elif variant == 'ghost' %}bg-transparent text-slate-600 hover:bg-slate-100 hover:text-slate-900{% elif variant == 'secondary' %}border border-slate-300 bg-white text-slate-700 shadow-sm hover:bg-slate-50{% else %}bg-primary-600 text-white shadow-sm hover:bg-primary-700{% endif %}">{{ text }}</a>
  {% endif %}
{% else %}
  <button type="{{ type|default:'button' }}" {% if disabled %}disabled{% endif %} {% if modal_target %}data-modal-open="{{ modal_target }}" aria-haspopup="dialog" aria-controls="{{ modal_target }}"{% endif %} {% if modal_close %}data-modal-close{% endif %} {% if toast_message %}data-toast-trigger data-toast-level="{{ toast_level|default:'info' }}" data-toast-message="{{ toast_message }}"{% endif %} class="inline-flex min-h-10 items-center justify-center whitespace-nowrap rounded-lg px-4 py-2 text-sm font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 {% if variant == 'danger' %}bg-danger text-white shadow-sm hover:bg-red-700 disabled:hover:bg-danger{% elif variant == 'ghost' %}bg-transparent text-slate-600 hover:bg-slate-100 hover:text-slate-900 disabled:hover:bg-transparent disabled:hover:text-slate-600{% elif variant == 'secondary' %}border border-slate-300 bg-white text-slate-700 shadow-sm hover:bg-slate-50 disabled:hover:bg-white{% else %}bg-primary-600 text-white shadow-sm hover:bg-primary-700 disabled:hover:bg-primary-600{% endif %}">{{ text }}</button>
{% endif %}
