{% if messages %}
  <div id="django-message-queue" hidden>
    {% for message in messages %}
      <div data-toast-message="{{ message }}" data-toast-level="{% if 'error' in message.tags %}error{% elif 'warning' in message.tags %}warning{% elif 'success' in message.tags %}success{% else %}info{% endif %}"></div>
    {% endfor %}
  </div>
{% endif %}
<div id="toast-viewport" class="pointer-events-none fixed inset-x-4 top-4 z-60 flex flex-col items-end gap-3 sm:inset-x-auto sm:right-5 sm:w-full sm:max-w-sm" aria-live="polite" aria-atomic="false"></div>
