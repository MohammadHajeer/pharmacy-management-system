<button
  type="button"
  data-theme-toggle
  hidden
  role="switch"
  aria-checked="false"
  class="relative grid h-9 w-16 shrink-0 grid-cols-2 items-center rounded-control border border-line bg-surface-muted p-0.5 text-xs font-semibold text-muted shadow-sm hover:border-line-strong hover:bg-surface-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 focus-visible:ring-offset-2 active:scale-[0.98] md:w-36"
  aria-label="Switch to dark mode"
  title="Switch to dark mode"
>
  <span
    class="inline-flex h-full min-w-0 items-center justify-center gap-1.5 rounded-md bg-accent-soft px-0 text-accent-strong shadow-sm ring-1 ring-inset ring-accent-line dark:bg-transparent dark:text-muted dark:shadow-none dark:ring-transparent md:px-1.5"
  >
    {% include "components/icon.html" with name="sun" class="size-4 shrink-0" only %}
    <span class="hidden md:inline">Light</span>
  </span>

  <span
    class="inline-flex h-full min-w-0 items-center justify-center gap-1.5 rounded-md bg-transparent px-0 text-muted ring-1 ring-inset ring-transparent dark:bg-accent-soft dark:text-accent-strong dark:shadow-sm dark:ring-accent-line md:px-1.5"
  >
    {% include "components/icon.html" with name="moon" class="size-4 shrink-0" only %}
    <span class="hidden md:inline">Dark</span>
  </span>
</button>
