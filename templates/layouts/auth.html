{% extends "base.html" %}
{% load static %}

{% block extra_head %}
  <style>
    .auth-surface {
      background:
        radial-gradient(circle at 8% 6%, rgb(20 184 166 / 10%), transparent 31rem),
        radial-gradient(circle at 92% 94%, rgb(6 182 212 / 7%), transparent 34rem),
        #f8fafc;
    }
  </style>
  {% block auth_extra_head %}{% endblock %}
{% endblock %}

{% block body %}
  <main class="auth-surface flex min-h-screen items-center justify-center px-4 py-8 sm:px-6 sm:py-10">
    <div class="w-full max-w-104">
      <a href="/" class="mx-auto mb-5 flex w-fit max-w-full items-center rounded-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary-600" aria-label="Pharmanex home">
        <img src="{% static 'logo.png' %}" alt="Pharmanex" class="h-20 w-auto max-w-full object-contain sm:h-[5.5rem]">
      </a>
      <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-7" aria-labelledby="auth-title">
        {% block content %}{% endblock %}
      </section>
    </div>
  </main>
{% endblock %}
