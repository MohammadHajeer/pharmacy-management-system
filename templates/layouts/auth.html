{% extends "base.html" %}
{% load static %}

{% block body %}
  <main class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10 sm:py-12">
    <div class="w-full max-w-md">
      <a href="/" class="mx-auto mb-7 flex w-fit max-w-full items-center rounded-xl focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary-600" aria-label="Pharmanex home">
        <img src="{% static 'logo.png' %}" alt="Pharmanex" class="h-24 w-auto max-w-full object-contain">
      </a>
      <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        {% block content %}{% endblock %}
      </section>
      <p class="mt-6 text-center text-xs text-slate-400">Secure pharmacy administration access</p>
    </div>
  </main>
{% endblock %}
