{% load static django_browser_reload %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Pharmacy Management System">
    <title>{% block title %}Pharmacy Management System{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    {% block extra_head %}{% endblock %}
  </head>
  <body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased {% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}

    {% include "components/toast.html" %}
    <script src="{% static 'js/form-submit.js' %}" defer></script>
    <script src="{% static 'js/sidebar.js' %}" defer></script>
    <script src="{% static 'js/modal.js' %}" defer></script>
    <script src="{% static 'js/toast.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
    {% django_browser_reload_script %}
  </body>
</html>
